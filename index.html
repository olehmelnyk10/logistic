<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Логістичні заявки — ПРАЙМСТАРТ</title>
  
  <!-- PWA Мета-теги для встановлення на телефон / ПК -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Логістика">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830305.png">
  
  <!-- Вбудований PWA Manifest -->
  <link rel="manifest" href='data:application/json,{"name":"Логістика ПРАЙМСТАРТ","short_name":"Логістика","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#4f46e5","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2830/2830305.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    iframe { width: 100%; height: 100%; border: none; outline: none; }
    
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p style="margin-top:16px; color:#64748b; font-size:14px; font-weight:500;">Завантаження системи ПРАЙМСТАРТ...</p>
  </div>

  <!-- Інтерфейс Google Apps Script розгортається на весь екран без плашок Google -->
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbzh-XDAP8wIrV0XwxyZa0b5H-TO2XRfHzbvrLd_V5DbTuhKLIDv-79dsdky4TsXB0coow/exec" allow="geolocation; microphone; camera"></iframe>

  <script>
    const iframe = document.getElementById('appFrame');
    const loader = document.getElementById('loader');

    iframe.onload = () => {
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 400);
    };

    // Автоматична реєстрація Service Worker для перетворення сайту на PWA-додаток
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
